<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<style>
  body { width: 320px; padding: 16px; }
  .acoes { display: grid; gap: 8px; margin: 16px 0 12px; }
  #semChave {
    display: none; margin: 16px 0 4px; padding: 12px; border-radius: 12px;
    background: #f871711a; border: 1px solid #f8717155; font-size: 13px;
  }
  .rodape { display: flex; justify-content: space-between; font-size: 12px; color: var(--suave); }
</style>
<div class="topo">
  <img src="icones/48.png" alt="">
  <h1>Manga Tradutor<small>Balões em português</small></h1>
</div>

<div id="semChave">Falta a chave da DeepSeek. <a href="#" class="config">Configurar agora</a></div>

<div class="acoes" id="acoes">
  <button class="botao" data-acao="pagina">
    <span class="ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </span>
    <span><b>Traduzir página</b><span class="dica">Tudo que está visível</span></span>
    <kbd id="atalho-pagina"></kbd>
  </button>
  <button class="botao" data-acao="recortar">
    <span class="ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
    </span>
    <span><b>Recortar área</b><span class="dica">Arraste sobre os balões</span></span>
    <kbd id="atalho-recortar"></kbd>
  </button>
</div>

<div class="rodape">
  <a href="#" class="config">Configurações</a>
  <a href="#" class="config">Mudar atalhos</a>
</div>
<script src="atalhos.js"></script>
<script src="popup.js"></script>
</html>
