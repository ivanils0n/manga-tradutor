<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<style>
  body { width: 330px; padding: 14px 14px 12px; }
  header {
    position: relative; display: flex; align-items: center; gap: 11px;
    padding: 12px 12px 12px 10px; margin-bottom: 14px; overflow: hidden;
  }
  header::after { /* retícula no canto do quadro */
    content: ""; position: absolute; inset: 0 0 0 55%;
    background-image: radial-gradient(rgb(226 65 46 / .35) 1.2px, transparent 1.7px);
    background-size: 7px 7px;
    -webkit-mask: linear-gradient(90deg, transparent, #000); mask: linear-gradient(90deg, transparent, #000);
    pointer-events: none;
  }
  header img { width: 42px; height: 42px; flex: none; }
  header .titulo { font-size: 26px; }
  .provedor { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12px; color: var(--tinta-suave); }
  .provedor i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .provedor.falta i { background: var(--hanko); }
  .provedor.falta { color: var(--hanko-escuro); font-weight: 700; }

  .acoes { display: grid; gap: 9px; }
  .botao .ico {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px;
    border: 2px solid var(--tinta); border-radius: 7px; background: var(--hanko); color: #fff;
  }
  .botao b { display: block; font-size: 14.5px; }
  .botao small { color: var(--tinta-suave); font-size: 12px; }
  .botao kbd { margin-left: auto; }

  .linha-auto {
    display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px;
    border: 2px dashed var(--tinta-suave); border-radius: 8px;
  }
  .linha-auto b { display: block; font-size: 13.5px; }
  .linha-auto small { color: var(--tinta-suave); font-size: 12px; overflow-wrap: anywhere; }
  .linha-auto .chave-liga { margin-left: auto; }

  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12.5px; }
  footer button { background: none; border: 0; padding: 0; font: inherit; color: var(--tinta-suave); cursor: pointer; display: flex; gap: 6px; align-items: center; }
  footer button:hover { color: var(--tinta); }
  footer kbd { font-size: 10.5px; padding: 1px 5px; min-width: 0; }
</style>

<header class="quadro">
  <img src="icones/128.png" alt="">
  <div>
    <h1 class="titulo">Manga Tradutor</h1>
    <div class="provedor" id="provedor"><i></i><span>…</span></div>
  </div>
</header>

<div class="acoes">
  <button class="botao" data-acao="pagina">
    <span class="ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
    </span>
    <span><b>Traduzir página</b><small>Tudo o que está na tela</small></span>
    <kbd id="atalho-pagina"></kbd>
  </button>
  <button class="botao" data-acao="recortar">
    <span class="ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
    </span>
    <span><b>Recortar área</b><small>Só os balões que você marcar</small></span>
    <kbd id="atalho-recortar"></kbd>
  </button>
</div>

<label class="linha-auto">
  <span><b>Traduzir ao rolar</b><small>e adiantar as próximas páginas · <span id="site">neste site</span></small></span>
  <span class="chave-liga"><input type="checkbox" id="auto"><span></span></span>
</label>

<footer>
  <button id="alternar">Mostrar/ocultar traduções <kbd id="atalho-alternar"></kbd></button>
  <a href="#" id="config">Configurações</a>
</footer>
<script src="atalhos.js"></script>
<script src="popup.js"></script>
</html>
