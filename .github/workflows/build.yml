name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle testDebugUnitTest assembleDebug
      - name: Publicar APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk manga-tradutor.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest manga-tradutor.apk --title "Última versão" --notes "Gerado do commit ${{ github.sha }}" --target ${{ github.sha }}
